<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cours de mathématiques</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Cours, exercices, corrigés, fiches méthode, flashcards et QCM de mathématiques.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@500&display=swap">
<script>
  try { var t = localStorage.getItem('theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<style>
/* Mise en page : un bandeau ardoise en haut (en-tête + titre de la page), puis des cartes blanches sur fond gris clair. */
:root {
  --fond: #f1f2f5; --carte: #ffffff; --encre: #1b2030; --encre-2: #5a6172; --bord: #dfe2ea; --bord-fort: #c6cad6;
  --rouge: #c8102e; --rouge-texte: #a50d26; --rouge-doux: #fde8eb; --sur-rouge: #ffffff;
  --bande: #1c2232; --bande-encre: #eef0f6; --bande-encre-2: #b4bacb; --bande-accent: #ff7a8c; --bande-bord: #3a4258; --bande-champ: #262d40; --bande-pastille: #e0263f;
  --vert: #0f7556; --vert-doux: #e0f4ec;
  --t-cours: #b80e2a; --t-cours-bg: #fde8eb;
  --t-met: #995204; --t-met-bg: #fdf0dc;
  --t-exo: #1f4fb8; --t-exo-bg: #e7eeff;
  --t-cor: #0f7556; --t-cor-bg: #e0f4ec;
  --t-dia: #6a3cc0; --t-dia-bg: #efe8fd;
  --t-fla: #0c6582; --t-fla-bg: #ddf2f8;
  --t-qcm: #a8215f; --t-qcm-bg: #fbe6f0;
  --t-aut: #565e70; --t-aut-bg: #eceef3;
  --t-rev: #4b6b0a; --t-rev-bg: #edf5da;
  --f-titre: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-texte: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --rayon: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #11141c; --carte: #1a1f2b; --encre: #eceef4; --encre-2: #a3a9b8; --bord: #2a3040; --bord-fort: #3b4254;
    --rouge: #ff5a6e; --rouge-texte: #ff8292; --rouge-doux: #3a1a21; --sur-rouge: #1b0a0e;
    --bande: #0a0d14; --bande-encre: #eef0f6; --bande-encre-2: #a9b0c3; --bande-accent: #ff8292; --bande-bord: #262c3c; --bande-champ: #151a26; --bande-pastille: #e0263f;
    --vert: #62d2a8; --vert-doux: #12352a;
    --t-cours: #ff8292; --t-cours-bg: #3a1a21; --t-met: #f2b35e; --t-met-bg: #3a2a13; --t-exo: #93b2ff; --t-exo-bg: #1c2747;
    --t-cor: #62d2a8; --t-cor-bg: #12352a; --t-dia: #bc9eff; --t-dia-bg: #2a2147; --t-fla: #62c9e3; --t-fla-bg: #12313b;
    --t-qcm: #f28dbd; --t-qcm-bg: #3a1a2c; --t-aut: #a3a9b8; --t-aut-bg: #262a34;
    --t-rev: #b3d96b; --t-rev-bg: #232d10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fond: #11141c; --carte: #1a1f2b; --encre: #eceef4; --encre-2: #a3a9b8; --bord: #2a3040; --bord-fort: #3b4254;
  --rouge: #ff5a6e; --rouge-texte: #ff8292; --rouge-doux: #3a1a21; --sur-rouge: #1b0a0e;
  --bande: #0a0d14; --bande-encre: #eef0f6; --bande-encre-2: #a9b0c3; --bande-accent: #ff8292; --bande-bord: #262c3c; --bande-champ: #151a26; --bande-pastille: #e0263f;
  --vert: #62d2a8; --vert-doux: #12352a;
  --t-cours: #ff8292; --t-cours-bg: #3a1a21; --t-met: #f2b35e; --t-met-bg: #3a2a13; --t-exo: #93b2ff; --t-exo-bg: #1c2747;
  --t-cor: #62d2a8; --t-cor-bg: #12352a; --t-dia: #bc9eff; --t-dia-bg: #2a2147; --t-fla: #62c9e3; --t-fla-bg: #12313b;
  --t-qcm: #f28dbd; --t-qcm-bg: #3a1a2c; --t-aut: #a3a9b8; --t-aut-bg: #262a34;
    --t-rev: #b3d96b; --t-rev-bg: #232d10;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--fond); color: var(--encre); font: 17px/1.6 var(--f-texte); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bande); }
a { color: var(--rouge-texte); }
h1, h2, h3, h4 { font-family: var(--f-titre); line-height: 1.15; text-wrap: balance; margin: 0; }
:focus-visible { outline: 3px solid var(--rouge); outline-offset: 2px; border-radius: 6px; }
.cache { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.enveloppe { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Bandeau */
.bandeau { background: var(--bande); color: var(--bande-encre); }
.bandeau a { color: var(--bande-encre); }
.entete { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bande); border-bottom: 1px solid transparent; transition: border-color .2s; }
.entete.colle { border-bottom-color: var(--bande-bord); }
.entete .enveloppe { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 12px; }
.marque { display: flex; align-items: center; gap: 12px; text-decoration: none; margin-right: auto; min-width: 0; }
.logo { width: 40px; height: 40px; border-radius: 10px; background: var(--bande-pastille); color: #ffffff; display: grid; place-items: center; font: 500 14px var(--f-mono); flex: none; }
.marque-texte { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.marque-nom { font: 800 19px/1.15 var(--f-titre); }
.marque-lieu { font-size: 13px; color: var(--bande-encre-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { text-decoration: none; padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: 15px; }
.nav a:hover { background: var(--bande-champ); }
.nav a[aria-current="page"] { background: var(--bande-pastille); color: #ffffff; }
.outils { display: flex; gap: 8px; align-items: center; }
.recherche { position: relative; }
.recherche svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--bande-encre-2); pointer-events: none; }
.recherche input { font: inherit; font-size: 15px; width: 230px; padding: 8px 14px 8px 36px; border-radius: 999px; border: 1px solid var(--bande-bord); background: var(--bande-champ); color: var(--bande-encre); }
.recherche input::placeholder { color: var(--bande-encre-2); }
.recherche input:focus { outline: none; border-color: var(--bande-accent); }
.bouton-icone { width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--bande-bord); background: var(--bande-champ); color: var(--bande-encre); display: grid; place-items: center; cursor: pointer; flex: none; }
.bouton-icone:hover { border-color: var(--bande-accent); }
.bouton-icone svg { width: 19px; height: 19px; }
@media (max-width: 760px) {
  .outils { width: 100%; }
  .recherche { flex: 1; }
  .recherche input { width: 100%; }
}
.tete { padding-block: 28px 56px; display: flex; flex-direction: column; gap: 12px; }
.tete.haute { padding-block: 36px 104px; }
.tete h1 { font-weight: 800; font-size: clamp(32px, 5.4vw, 54px); line-height: 1.05; letter-spacing: -.02em; max-width: 20ch; }
.tete .prose { color: var(--bande-encre-2); }
.tete .prose a { color: var(--bande-encre); }
.tete .prose strong { color: var(--bande-encre); }
.surtitre { font: 500 13px var(--f-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--rouge-texte); }
.bandeau .surtitre { color: var(--bande-accent); }
.fil { font-size: 15px; color: var(--bande-encre-2); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.bandeau .fil a { color: var(--bande-encre-2); }
.bandeau .fil a:hover { color: var(--bande-encre); }

main { padding-block: 28px 64px; display: flex; flex-direction: column; gap: 24px; }
main.chevauche { margin-top: -72px; }

/* Éléments communs */
.carte { background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon); }
.prose { max-width: 65ch; }
.prose p { margin: 0 0 .8em; }
.prose p:last-child { margin-bottom: 0; }
.prose ul, .prose ol { margin: 0 0 .8em; padding-left: 1.3em; }
.prose li { margin-bottom: .25em; }
.prose h2 { font-size: 24px; margin: 1.3em 0 .5em; }
.prose h3 { font-size: 19px; margin: 1.1em 0 .4em; }
.prose h2:first-child, .prose h3:first-child { margin-top: 0; }
.titre-section { font-size: 21px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; }
.titre-section small { font: 500 13px var(--f-mono); color: var(--encre-2); }
.puce { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--cb); color: var(--c); white-space: nowrap; }
.puce-nouveau { font: 700 11px var(--f-texte); letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--rouge); color: var(--sur-rouge); vertical-align: 2px; white-space: nowrap; }
[data-type="cours"] { --c: var(--t-cours); --cb: var(--t-cours-bg); }
[data-type="methode"] { --c: var(--t-met); --cb: var(--t-met-bg); }
[data-type="exercices"] { --c: var(--t-exo); --cb: var(--t-exo-bg); }
[data-type="corriges"] { --c: var(--t-cor); --cb: var(--t-cor-bg); }
[data-type="diaporama"] { --c: var(--t-dia); --cb: var(--t-dia-bg); }
[data-type="flashcards"] { --c: var(--t-fla); --cb: var(--t-fla-bg); }
[data-type="qcm"] { --c: var(--t-qcm); --cb: var(--t-qcm-bg); }
[data-type="autres"] { --c: var(--t-aut); --cb: var(--t-aut-bg); }
[data-type="revision"] { --c: var(--t-rev); --cb: var(--t-rev-bg); }
[data-type="chapitre"] { --c: var(--rouge-texte); --cb: var(--rouge-doux); }
.bouton { font: 700 15px var(--f-texte); display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; min-height: 42px; border-radius: 999px; border: 1px solid var(--bord-fort); background: var(--carte); color: var(--encre); cursor: pointer; text-decoration: none; }
.bouton:hover { border-color: var(--rouge); color: var(--rouge-texte); }
.bouton.plein { background: var(--rouge); border-color: var(--rouge); color: var(--sur-rouge); }
.bouton.plein:hover { filter: brightness(1.08); color: var(--sur-rouge); }
.bouton.discret { border-color: transparent; background: transparent; color: var(--encre-2); padding-inline: 8px; }
.bouton.discret:hover { color: var(--rouge-texte); }
.bouton svg { width: 17px; height: 17px; }
.grille-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 24px; align-items: start; }
.bloc { padding: 24px 26px; display: flex; flex-direction: column; gap: 14px; }
.bloc > h2 { font-size: 21px; }

/* Accueil */
.classe { display: flex; flex-direction: column; gap: 6px; padding: 26px 28px; text-decoration: none; color: var(--encre); transition: border-color .15s, transform .15s; }
.classe:hover { border-color: var(--rouge); transform: translateY(-2px); }
.classe-chiffres { font: 500 13px var(--f-mono); color: var(--rouge-texte); font-variant-numeric: tabular-nums; }
.classe h2 { font-size: 32px; font-weight: 800; }
.classe p { margin: 0; color: var(--encre-2); font-size: 15px; }
.classe-lien { margin-top: 8px; font-weight: 700; font-size: 15px; color: var(--rouge-texte); }
.annonces .prose h4 { font: 500 13px var(--f-mono); color: var(--rouge-texte); margin: 14px 0 2px; padding-top: 12px; border-top: 1px solid var(--bord); }
.annonces .prose h4:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
.annonces .prose p { margin-bottom: 0; }
.nouveautes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.nouveautes li + li { border-top: 1px solid var(--bord); }
.nouveaute { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 2px 12px; align-items: baseline; padding: 10px 0; text-decoration: none; color: var(--encre); }
.nouveaute:hover .nouveaute-titre { color: var(--rouge-texte); }
.nouveaute .puce { grid-row: span 2; align-self: center; justify-self: start; }
.nouveaute-titre { font-weight: 700; line-height: 1.35; }
.nouveaute-lieu { font-size: 14px; color: var(--encre-2); }
.contact { padding: 20px 26px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.contact strong { font-family: var(--f-titre); font-size: 19px; margin-right: auto; }
.adresse { font: 500 15px var(--f-mono); user-select: all; overflow-wrap: anywhere; }

/* Page d'une classe */
.classe-grille { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
.chapitres { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 16px; }
.chapitre { padding: 20px; display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--encre); transition: border-color .15s, transform .15s; }
.chapitre:hover { border-color: var(--rouge); transform: translateY(-2px); }
.chapitre-num { font: 500 13px var(--f-mono); color: var(--rouge-texte); }
.chapitre h3 { font-size: 20px; }
.puces { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 6px; }
.progression { padding: 22px; }
.progression h3 { font-size: 20px; margin-bottom: 10px; }
.progression ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
.progression li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; margin: 0; }
.progression li::before { content: ""; width: 16px; height: 16px; margin-top: 4px; border-radius: 50%; border: 2px solid var(--bord-fort); }
.progression li.fait { color: var(--encre-2); }
.progression li.fait::before { background: var(--vert); border-color: var(--vert); }
.progression li.encours { font-weight: 700; }
.progression li.encours::before { border-color: var(--rouge); background: radial-gradient(circle, var(--rouge) 0 3px, transparent 4px); }
.legende { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--bord); font-size: 13px; color: var(--encre-2); }
.legende span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; border: 2px solid var(--bord-fort); }
.legende .l-fait::before { background: var(--vert); border-color: var(--vert); }
.legende .l-encours::before { border-color: var(--rouge); }

/* Page d'un chapitre */
.essentiel { padding: 22px 26px; display: flex; flex-direction: column; gap: 12px; }
.essentiel-haut { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.essentiel-haut h2 { font-size: 21px; display: flex; align-items: center; gap: 10px; }
.essentiel-haut h2 svg { width: 22px; height: 22px; color: var(--rouge); }
.essentiel .prose { max-width: none; columns: 2 300px; column-gap: 40px; }
.essentiel .prose h3 { break-after: avoid; font-size: 16px; font-family: var(--f-mono); font-weight: 500; letter-spacing: .05em; text-transform: uppercase; color: var(--rouge-texte); }
.essentiel .prose ul { break-inside: auto; }
.essentiel .prose li { break-inside: avoid; }
.groupes { display: flex; flex-direction: column; gap: 28px; }
.groupe { display: flex; flex-direction: column; gap: 12px; }
.groupe-titre { display: flex; align-items: center; gap: 10px; font-size: 20px; }
.groupe-titre .pastille { width: 12px; height: 12px; border-radius: 4px; background: var(--c); }
.docs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.docs.larges { grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); }
.doc { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 14px; text-decoration: none; color: var(--encre); transition: border-color .15s; }
a.doc:hover { border-color: var(--c); }
.doc-icone { width: 48px; height: 56px; border-radius: 8px; background: var(--cb); color: var(--c); display: grid; place-items: center; font: 500 12px var(--f-mono); position: relative; }
.doc-icone::after { content: ""; position: absolute; top: 0; right: 0; width: 14px; height: 14px; background: var(--carte); clip-path: polygon(0 0, 100% 100%, 100% 0); }
.doc-titre { font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.doc-meta { font: 500 12px var(--f-mono); color: var(--encre-2); font-variant-numeric: tabular-nums; }
.doc-action { font-size: 14px; font-weight: 700; color: var(--c); white-space: nowrap; }
.doc.attente { border-style: dashed; color: var(--encre-2); }
.doc.attente .doc-icone { background: transparent; border: 1px dashed var(--bord-fort); color: var(--encre-2); }
.doc.attente .doc-icone::after { display: none; }
.vide { padding: 22px; color: var(--encre-2); text-align: center; }

/* Flashcards */
.paquet { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.paquet-haut { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.paquet-haut h3 { font-size: 19px; }
.jauge { display: flex; flex-direction: column; gap: 6px; }
.jauge-barre { height: 8px; border-radius: 999px; background: var(--fond); overflow: hidden; display: flex; }
.jauge-barre span { display: block; height: 100%; }
.jauge-sues { background: var(--vert); }
.jauge-revoir { background: var(--rouge); }
.jauge-texte { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--encre-2); font-variant-numeric: tabular-nums; }
.jauge-texte b { color: var(--encre); }
.flash { display: block; perspective: 1200px; cursor: pointer; border: 0; background: none; padding: 0; font: inherit; color: inherit; text-align: center; width: 100%; }
.flash-int { display: grid; position: relative; transition: transform .45s; transform-style: preserve-3d; }
.flash.retournee .flash-int { transform: rotateY(180deg); }
.face { grid-area: 1 / 1; position: relative; min-height: 210px; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px 22px; font-size: clamp(16px, 2.2vw, 19px); line-height: 1.5; overflow-wrap: anywhere; }
.face small { font: 500 12px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--t-fla); }
.face .aide { font-size: 13px; color: var(--encre-2); }
.recto { background: var(--t-fla-bg); color: var(--encre); border: 1px solid var(--bord); }
.verso { background: var(--carte); border: 2px solid var(--t-fla); transform: rotateY(180deg); }
.etat-carte { position: absolute; top: 10px; right: 12px; font: 700 11px var(--f-texte); letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--carte); color: var(--encre-2); }
.etat-carte.revoir { background: var(--rouge-doux); color: var(--rouge-texte); }
.etat-carte.sue { background: var(--vert-doux); color: var(--vert); }
.paquet-bas { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.paquet-bas .reponses { display: flex; gap: 8px; flex: 1 1 auto; }
.paquet-bas .reponses .bouton { flex: 1 1 0; }
.bouton.revoir { border-color: var(--rouge); color: var(--rouge-texte); }
.bouton.revoir:hover { background: var(--rouge-doux); }
.bouton.savais { border-color: var(--vert); background: var(--vert); color: var(--carte); }
.bouton.savais:hover { filter: brightness(1.08); color: var(--carte); }
.paquet-outils { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.bravo { padding: 26px 20px; border-radius: 12px; background: var(--vert-doux); color: var(--encre); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.bravo strong { font-family: var(--f-titre); font-size: 22px; color: var(--vert); }

/* QCM */
.qcm { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.qcm-question { font-size: 18px; font-weight: 700; line-height: 1.45; }
.qcm-num { font: 500 13px var(--f-mono); color: var(--t-qcm); }
.options { display: flex; flex-direction: column; gap: 8px; }
.option { font: inherit; text-align: left; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px 14px; min-height: 48px; border-radius: 10px; border: 1px solid var(--bord-fort); background: var(--carte); color: var(--encre); cursor: pointer; }
.option:hover:not(:disabled) { border-color: var(--t-qcm); }
.option:disabled { cursor: default; }
.option-lettre { width: 30px; height: 30px; border-radius: 50%; background: var(--t-qcm-bg); color: var(--t-qcm); display: grid; place-items: center; font: 500 13px var(--f-mono); }
.option.juste { border: 2px solid var(--vert); background: var(--vert-doux); }
.option.juste .option-lettre { background: var(--vert); color: var(--carte); }
.option.faux { border: 2px solid var(--rouge); background: var(--rouge-doux); }
.option.faux .option-lettre { background: var(--rouge); color: var(--sur-rouge); }
.option.terne { opacity: .6; }
.verdict { padding: 12px 16px; border-radius: 10px; background: var(--fond); }
.verdict strong { display: block; margin-bottom: 2px; }
.verdict.ok strong { color: var(--vert); }
.verdict.ko strong { color: var(--rouge-texte); }
.qcm-bas { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; color: var(--encre-2); font-variant-numeric: tabular-nums; }
.score { padding: 26px 20px; border-radius: 12px; background: var(--t-qcm-bg); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.score-note { font: 800 44px/1 var(--f-titre); color: var(--t-qcm); font-variant-numeric: tabular-nums; }

/* Révisions */
.themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; }
.theme { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; text-decoration: none; color: var(--encre); transition: border-color .15s, transform .15s; }
.theme:hover { border-color: var(--c); transform: translateY(-2px); }
.theme h3 { font-size: 19px; }
.theme-lien { font-weight: 700; font-size: 15px; color: var(--c); }
.rev { display: flex; flex-direction: column; gap: 16px; }
.rev-bilan { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.rev-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; }
.rev-num { font: 500 14px var(--f-mono); height: 40px; border-radius: 8px; border: 1px solid var(--bord-fort); background: var(--carte); color: var(--encre-2); cursor: pointer; font-variant-numeric: tabular-nums; }
.rev-num:hover { border-color: var(--t-rev); }
.rev-num.ok { background: var(--vert); border-color: var(--vert); color: var(--carte); }
.rev-num.ko { background: var(--rouge-doux); border-color: var(--rouge); color: var(--rouge-texte); }
.rev-num[aria-current="true"] { outline: 3px solid var(--t-rev); outline-offset: 2px; }
.rev-exo { padding: 22px; display: flex; flex-direction: column; gap: 16px; scroll-margin-top: 90px; }
.rev-consigne { font-weight: 700; }
.rev-enonce { font-size: clamp(21px, 4vw, 28px); text-align: center; padding: 18px 12px; border-radius: 12px; background: var(--t-rev-bg); overflow-x: auto; }
.rev-enonce.figure { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.rev-courbe { display: block; width: 100%; height: auto; }
.rev-courbe .fond { fill: var(--carte); }
.rev-courbe .g { stroke: var(--bord); stroke-width: 1; }
.rev-courbe .a { stroke: var(--encre); stroke-width: 1.6; }
.rev-courbe .f { fill: var(--encre); }
.rev-courbe .c { fill: none; stroke: var(--rouge); stroke-width: 2.6; stroke-linecap: round; }
.rev-courbe .p { fill: var(--rouge); }
.rev-courbe text { font: 500 11px var(--f-mono); fill: var(--encre-2); }
.rev-tab { max-width: 100%; overflow-x: auto; }
.rev-tab table { border-collapse: collapse; background: var(--carte); font-size: 19px; }
.rev-tab th, .rev-tab td { border: 1px solid var(--bord-fort); padding: 8px 14px; text-align: center; font-weight: 500; white-space: nowrap; }
.rev-tab th { background: var(--fond); }
.rev-enonce.long { font-size: clamp(17px, 2.6vw, 21px); line-height: 1.5; }
.rev-libelle { font-size: 14px; font-weight: 700; color: var(--encre-2); margin-bottom: -10px; }
.rev-champ { display: flex; gap: 8px; flex-wrap: wrap; }
.rev-saisie { flex: 1 1 150px; min-width: 0; font: 500 19px var(--f-mono); padding: 10px 14px; min-height: 48px; border-radius: 10px; border: 1px solid var(--bord-fort); background: var(--carte); color: var(--encre); }
.rev-saisie:focus { outline: none; border-color: var(--t-rev); box-shadow: 0 0 0 3px var(--t-rev-bg); }
.rev-saisie[readonly] { background: var(--vert-doux); border-color: var(--vert); }
.rev-outils { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.rev-touches { display: flex; flex-wrap: wrap; gap: 6px; }
.rev-touche { font: 500 15px var(--f-mono); min-width: 44px; height: 38px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--bord); background: var(--fond); color: var(--encre); cursor: pointer; }
.rev-touche:hover { border-color: var(--t-rev); }
.rev-aide { font-size: 13px; color: var(--encre-2); }
.rev-apercu { min-height: 30px; font-size: 18px; overflow-x: auto; }
.rev-apercu .lu { font-size: 13px; color: var(--encre-2); margin-right: 6px; }
.rev-apercu .rev-erreur { font-size: 15px; color: var(--rouge-texte); }
.verdict.presque strong { color: var(--t-met); }
.rev-correction { padding: 12px 16px; border-radius: 10px; border: 1px dashed var(--bord-fort); display: flex; flex-direction: column; gap: 6px; overflow-x: auto; }
.rev-correction strong { font-family: var(--f-titre); }
.rev-bas { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.rev-nav { display: flex; gap: 8px; margin-left: auto; }
.bouton:disabled { opacity: .45; cursor: default; }
.bouton:disabled:hover { border-color: var(--bord-fort); color: var(--encre); }
.bouton.plein:disabled:hover { color: var(--sur-rouge); }

/* Onglet Révisions et prérequis */
.domaines { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
.domaines .groupe { margin: 0; }
.prerequis { padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; border-left: 4px solid var(--t-rev); }
.prerequis h2 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
.prerequis p { margin: 0; color: var(--encre-2); font-size: 15px; }
.prereq-liste { display: flex; flex-wrap: wrap; gap: 8px; }
.prereq { display: inline-flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 999px; border: 1px solid var(--bord-fort); background: var(--carte); color: var(--encre); text-decoration: none; font-weight: 700; font-size: 15px; }
a.prereq:hover { border-color: var(--t-rev); }
.prereq.absent { font-weight: 500; color: var(--encre-2); border-style: dashed; padding-right: 14px; }
.prereq-score { font: 500 13px var(--f-mono); padding: 3px 9px; border-radius: 999px; background: var(--fond); color: var(--encre-2); font-variant-numeric: tabular-nums; }
.prereq-score.ok { background: var(--vert); color: var(--carte); }
.prereq-score.encours { background: var(--t-met-bg); color: var(--t-met); }

/* Code d'accès */
.bouton-eleve { height: 40px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--bande-bord); background: var(--bande-champ); color: var(--bande-encre); font: 500 13px var(--f-mono); cursor: pointer; white-space: nowrap; flex: none; }
.bouton-eleve:hover { border-color: var(--bande-accent); }
.bouton-eleve[hidden] { display: none; }
.ident-code::placeholder { text-transform: none; }
.bouton-eleve svg { width: 16px; height: 16px; }
.ident { padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; border: 2px solid var(--rouge); }
.ident-texte { flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.ident-texte h2 { font-size: 20px; }
.ident-texte p { margin: 0; font-size: 15px; color: var(--encre-2); }
.ident-form { flex: 1 1 300px; display: flex; flex-wrap: wrap; gap: 8px; }
.ident-code { flex: 1 1 140px; min-width: 0; font: 500 18px var(--f-mono); text-transform: uppercase; padding: 8px 12px; min-height: 44px; border-radius: 10px; border: 1px solid var(--bord-fort); background: var(--carte); color: var(--encre); }
.ident-code:focus { outline: none; border-color: var(--rouge); box-shadow: 0 0 0 3px var(--rouge-doux); }
.ident .envoi-msg { flex-basis: 100%; }
.envoi-code { margin: 0; font-size: 15px; }
.envoi-code b { font-family: var(--f-mono); font-weight: 500; }
.lien-bouton { font: inherit; font-size: 14px; font-weight: 700; color: var(--rouge-texte); background: none; border: 0; padding: 0 0 0 6px; cursor: pointer; text-decoration: underline; }

/* Envoi de la progression */
.cote { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.envoi { padding: 22px; display: flex; flex-direction: column; gap: 10px; }
.envoi h3 { font-size: 20px; }
.envoi-resume { margin: 0; font-size: 15px; color: var(--encre-2); }
.envoi-resume b { color: var(--encre); }
.envoi-msg { margin: 0; font-size: 14px; color: var(--encre-2); }
.envoi-msg.ok { color: var(--vert); font-weight: 700; }
.envoi-msg.erreur { color: var(--rouge-texte); font-weight: 700; }

/* Recherche */
.resultats { display: flex; flex-direction: column; gap: 10px; }
.resultat { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 12px 16px; text-decoration: none; color: var(--encre); }
.resultat:hover { border-color: var(--rouge); }
.resultat-titre { font-weight: 700; }
.resultat-lieu { font-size: 14px; color: var(--encre-2); width: 100%; }
mark { background: var(--rouge-doux); color: var(--rouge-texte); border-radius: 3px; padding: 0 2px; }

/* Méthodologie */
.page-texte { padding: 30px 34px; }
.page-texte .prose h2 { padding-top: 18px; border-top: 1px solid var(--bord); }
.page-texte .prose h2:first-child { padding-top: 0; border-top: 0; }

.pied { border-top: 1px solid var(--bord); background: var(--carte); font-size: 14px; color: var(--encre-2); }
.pied .enveloppe { padding-block: 18px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }

/* Impression */
#impression { display: none; }
@media print {
  body { background: #ffffff; color: #000000; font-size: 11pt; }
  body::before { display: none; }
  body.imprime > *:not(#impression) { display: none !important; }
  body.imprime #impression { display: block; }
  #impression h1 { font-size: 18pt; margin-bottom: 2pt; }
  #impression .sous-titre { font-size: 10pt; color: #444444; margin-bottom: 12pt; }
  #impression table { width: 100%; border-collapse: collapse; }
  #impression th, #impression td { border: 1px solid #999999; padding: 6pt 8pt; vertical-align: top; text-align: left; }
  #impression th { background: #eeeeee; font-size: 10pt; }
  #impression td.num { width: 22pt; color: #666666; }
  #impression tr { break-inside: avoid; }
  #impression .prose { max-width: none; }
}

@media (max-width: 860px) {
  .classe-grille { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 480px) {
  .tete.haute { padding-block: 24px 96px; }
  .bloc, .essentiel, .page-texte { padding: 20px; }
  .paquet-bas .reponses { flex-basis: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

<script>
(function () {
  'use strict';

  var TYPES = {

  };
  var ORDRE = Object.keys(TYPES);

  var JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
  var JOURS_NOUVEAU = 7;

  var D = null;
  var tete = document.getElementById('tete');
  var contenu = document.getElementById('contenu');
  var champ = document.getElementById('champ-recherche');

  /* ---------- Outils ---------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function norm(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
  function lienFichier(chemin) { return chemin.split('/').map(encodeURIComponent).join('/'); }
  function taille(o) {
    if (!o) return '';
    if (o < 1024 * 1024) return Math.max(1, Math.round(o / 1024)) + ' Ko';

  }
  function dateObj(iso) { var p = iso.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function dateLongue(iso) {
    var d = dateObj(iso), j = d.getDate();
    return JOURS[d.getDay()] + ' ' + j + (j === 1 ? 'er' : '') + ' ' + MOIS[d.getMonth()];
  }
  function dateCourte(iso) { var d = dateObj(iso), j = d.getDate(); return j + (j === 1 ? 'er' : '') + ' ' + MOIS[d.getMonth()]; }
  function aujourdhui() { var d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function estNouveau(iso) {
    if (!iso) return false;
    var ecart = (aujourdhui() - dateObj(iso)) / 86400000;
    return ecart >= 0 && ecart < JOURS_NOUVEAU;
  }
  function badgeNouveau(iso) { return estNouveau(iso) ? ' <span class="puce-nouveau">Nouveau</span>' : ''; }
  function deuxChiffres(n) { return (n < 10 ? '0' : '') + n; }
  function hachage(s) { var h = 5381; for (var i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; return h.toString(36); }
  function melanger(t) { for (var k = t.length - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)); var x = t[k]; t[k] = t[j]; t[j] = x; } return t; }
  function lire(cle) { try { return JSON.parse(localStorage.getItem(cle) || 'null'); } catch (e) { return null; } }
  function ecrire(cle, v) { try { localStorage.setItem(cle, JSON.stringify(v)); } catch (e) {} }
  function effacer(cle) { try { localStorage.removeItem(cle); } catch (e) {} }
  function pluriel(n, mot) { return n + ' ' + mot + (n > 1 ? 's' : ''); }

  /* Mini-Markdown : # titres, listes (- ou 1.), [x] [~] [ ], **gras**, *italique*, [liens](…), formules $…$. */
  function enLigne(t) {
    var morceaux = String(t).split(/(\$[^$]+\$)/g);
    return morceaux.map(function (m) {
      if (/^\$[^$]+\$$/.test(m)) return formules(m);
      return esc(m)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>')
        .replace(/\[([^\]]+)\]\(((?:https?:\/\/|\.?\/|documents\/|#)[^)\s]+)\)/g, function (_, txt, url) {

  }
  function md(src) {
    var html = '', para = [], liste = null;
    function finPara() { if (para.length) { html += '<p>' + enLigne(para.join(' ')) + '</p>'; para = []; } }
    function finListe() { if (liste) { html += '</' + liste + '>'; liste = null; } }
    String(src || '').replace(/\r/g, '').split('\n').forEach(function (l) {
      var t = l.trim(), m;
      if (!t) { finPara(); finListe(); return; }

        var n = m[1].length + 1;
        html += '<h' + n + '>' + enLigne(m[2]) + '</h' + n + '>';

        var genre = puce ? 'ul' : 'ol';

        html += '<li' + (cls ? ' class="' + cls + '"' : '') + '>' + enLigne(puce ? puce[2] : num[1]) + '</li>';

      }

    finPara(); finListe();

  /* Formules $…$ affichées avec KaTeX (chargé seulement si besoin). */
  var katexEtat = 'absent';
  var AJOUREES = { C: '\u2102', H: '\u210D', N: '\u2115', P: '\u2119', Q: '\u211A', R: '\u211D', Z: '\u2124' };

  /* ---------- Flashcards « je savais / à revoir » ---------- */
  var NIVEAUX = ['Nouvelle', 'À revoir', 'Sue', 'Maîtrisée'];
  var POIDS = [5, 7, 2, 1];
  var paquets = {};
  function etatPaquet(cle, p) {
    var e = paquets[cle];
    if (!e) {
      var memo = lire('fc:' + cle) || {};
      e = paquets[cle] = { p: p, ids: p.cartes.map(function (c) { return hachage(c.q); }), memo: memo, i: 0, retournee: false, fini: false };
      e.i = choisirCarte(e, -1);
    }
    return e;
  }
  function niveau(e, k) { return e.memo[e.ids[k]] || 0; }
  function choisirCarte(e, eviter) {
    var n = e.ids.length, total = 0, poids = [];
    for (var k = 0; k < n; k++) { var w = (k === eviter && n > 1) ? 0 : POIDS[niveau(e, k)]; poids.push(w); total += w; }
    var x = Math.random() * total;
    for (k = 0; k < n; k++) { x -= poids[k]; if (x < 0) return k; }
    return 0;
  }
  function bilan(e) {

    return b;
  }
  function cartePaquet(cle, p) {
    var e = etatPaquet(cle, p), n = p.cartes.length, b = bilan(e);
    var sues = b[2] + b[3], pc = function (x) { return (100 * x / n).toFixed(1) + '%'; };
    var jauge = '<div class="jauge"><div class="jauge-barre" aria-hidden="true"><span class="jauge-sues" style="width:' + pc(sues) + '"></span><span class="jauge-revoir" style="width:' + pc(b[1]) + '"></span></div>' +
      '<div class="jauge-texte"><span><b>' + sues + '</b> sue' + (sues > 1 ? 's' : '') + '</span><span><b>' + b[1] + '</b> à revoir</span><span><b>' + b[0] + '</b> jamais vue' + (b[0] > 1 ? 's' : '') + '</span></div></div>';
    var outils = '<div class="paquet-outils">' +
      '<button class="bouton discret" type="button" data-action="imprimer-paquet"><svg aria-hidden="true"><use href="#i-imprimer"/></svg>Imprimer</button>' +
      '<button class="bouton discret" type="button" data-action="reinitialiser">' + (e.confirmer ? 'Confirmer l’effacement ?' : 'Recommencer à zéro') + '</button></div>';

        '<button class="bouton" type="button" data-action="continuer">Continuer à réviser</button></div>';
    } else {

            '<span class="face verso"><small>Réponse</small><span>' + formules(carte.r) + '</span></span>' +
          '</span>' +
        '</button>' +
        '<div class="paquet-bas"><span class="reponses">' +
          '<button class="bouton revoir" type="button" data-action="revoir">À revoir</button>' +

  function actionPaquet(bloc, action) {

  /* ---------- QCM ---------- */
  var qcms = {};
  function etatQcm(cle, q) {
    var e = qcms[cle];

    if (!e.options && !e.fini) {

  function carteQcm(cle, q) {
    var e = etatQcm(cle, q), n = q.questions.length, corps;
    var meilleur = lire('qcm:' + cle);
    if (e.fini) {
      var msg = e.score === n ? 'Parfait, sans faute !' : e.score >= n * 0.7 ? 'Très bien, encore un petit effort.' : e.score >= n * 0.4 ? 'C’est un début : relisez le cours et recommencez.' : 'Revoyez le cours et les flashcards, puis réessayez.';
      corps = '<div class="score"><span class="score-note">' + e.score + ' / ' + n + '</span><span>' + msg + '</span>' +
        (meilleur != null ? '<span style="font-size:14px;color:var(--encre-2)">Meilleur score : ' + meilleur + ' / ' + n + '</span>' : '') +
        '<button class="bouton plein" type="button" data-action="recommencer">Recommencer</button></div>';
    } else {
      var qu = q.questions[e.i], lettres = 'ABCD';
      corps = '<span class="qcm-num">Question ' + (e.i + 1) + ' / ' + n + '</span>' +
        '<div class="qcm-question">' + formules(qu.q) + '</div>' +
        '<div class="options" role="group" aria-label="Réponses possibles">' + e.options.map(function (o, k) {
          var cls = '';
          if (e.choix != null) cls = o.ok ? ' juste' : (k === e.choix ? ' faux' : ' terne');
          return '<button type="button" class="option' + cls + '" data-action="choisir" data-k="' + k + '"' + (e.choix != null ? ' disabled' : '') + '>' +
            '<span class="option-lettre" aria-hidden="true">' + lettres.charAt(k) + '</span><span>' + formules(o.t) + '</span></button>';
        }).join('') + '</div>';
      if (e.choix != null) {
        var ok = e.options[e.choix].ok;
        corps += '<div class="verdict ' + (ok ? 'ok' : 'ko') + '" role="status"><strong>' + (ok ? 'Bonne réponse !' : 'Pas tout à fait.') + '</strong>' +
          (qu.expl ? formules(qu.expl) : (ok ? '' : 'La bonne réponse était : ' + formules(qu.bonne))) + '</div>' +
          '<div class="qcm-bas"><span>Score : ' + e.score + ' / ' + (e.i + 1) + '</span>' +
          '<button class="bouton plein" type="button" data-action="suivante">' + (e.i + 1 < n ? 'Question suivante' : 'Voir mon score') + '</button></div>';
      } else {
        corps += '<div class="qcm-bas"><span>Score : ' + e.score + ' / ' + e.i + '</span></div>';
      }
    }
    return '<div class="carte qcm" data-type="qcm" data-qcm="' + esc(cle) + '">' +
      '<div class="paquet-haut"><h3>' + esc(q.titre) + badgeNouveau(q.ajoute) + '</h3><span class="puce">' + pluriel(n, 'question') + '</span></div>' +
      corps + '</div>';
  }
  function actionQcm(bloc, action, bouton) {
    var cle = bloc.getAttribute('data-qcm'), e = qcms[cle], n = e.q.questions.length;
    if (action === 'choisir' && e.choix == null) {
      e.choix = Number(bouton.getAttribute('data-k'));
      if (e.options[e.choix].ok) e.score++;

      e.i++; e.choix = null; e.options = null;

      var g = /^\[\[(courbe|tableau):(.*)\]\]$/.exec(m);
      if (!g) return m.trim() ? '<span class="rev-texte">' + formules(m.trim()) + '</span>' : '';

  // Courbe lisse passant exactement par les points donnés, sans dépassement entre deux points

    var xs = pts.map(function (p) { return p[0]; }), ys = pts.map(function (p) { return p[1]; });

    var u = 32, m = 14, W = (x1 - x0) * u + 2 * m, H = (y1 - y0) * u + 2 * m;
    var X = function (x) { return m + (x - x0) * u; }, Y = function (y) { return m + (y1 - y) * u; };
    var n = pts.length, d = [], t = [], i, k, o = '';
    for (i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
    for (i = 0; i < n; i++) {
      if (i === 0) t.push(d[0]); else if (i === n - 1) t.push(d[n - 2]);
      else if (d[i - 1] * d[i] <= 0) t.push(0);
      else { var h1 = xs[i] - xs[i - 1], h2 = xs[i + 1] - xs[i], w1 = 2 * h2 + h1, w2 = h2 + 2 * h1; t.push((w1 + w2) / (w1 / d[i - 1] + w2 / d[i])); }
    }
    for (k = x0; k <= x1; k++) o += '<line class="g" x1="' + X(k) + '" y1="' + Y(y0) + '" x2="' + X(k) + '" y2="' + Y(y1) + '"/>';
    for (k = y0; k <= y1; k++) o += '<line class="g" x1="' + X(x0) + '" y1="' + Y(k) + '" x2="' + X(x1) + '" y2="' + Y(k) + '"/>';
    o += '<line class="a" x1="' + X(x0) + '" y1="' + Y(0) + '" x2="' + (X(x1) + 6) + '" y2="' + Y(0) + '"/><path class="f" d="M' + (X(x1) + 12) + ' ' + Y(0) + 'l-8 -4v8z"/>';
    o += '<line class="a" x1="' + X(0) + '" y1="' + Y(y0) + '" x2="' + X(0) + '" y2="' + (Y(y1) - 6) + '"/><path class="f" d="M' + X(0) + ' ' + (Y(y1) - 12) + 'l-4 8h8z"/>';

    for (k = x0 + 1; k < x1; k++) if (k && k % pasX === 0) o += '<text x="' + X(k) + '" y="' + (Y(0) + 14) + '" text-anchor="middle">' + String(k).replace('-', '−') + '</text>';
    for (k = y0 + 1; k < y1; k++) if (k && k % pasY === 0) o += '<text x="' + (X(0) - 6) + '" y="' + (Y(k) + 4) + '" text-anchor="end">' + String(k).replace('-', '−') + '</text>';
    o += '<text x="' + (X(0) - 6) + '" y="' + (Y(0) + 14) + '" text-anchor="end">0</text>';

    }
    o += '<path class="c" d="' + chemin + '"/><circle class="p" cx="' + X(xs[0]) + '" cy="' + Y(ys[0]) + '" r="3.5"/><circle class="p" cx="' + X(xs[n - 1]) + '" cy="' + Y(ys[n - 1]) + '" r="3.5"/>';
    return '<svg class="rev-courbe" viewBox="0 0 ' + (W + 8) + ' ' + H + '" style="max-width:' + (W + 8) + 'px" role="img" aria-label="Courbe représentative de la fonction dans un repère">' +
      '<rect class="fond" x="1" y="1" width="' + (W + 6) + '" height="' + (H - 2) + '" rx="10"/>' + o + '</svg>';
  }

  function vueRevision(c, ch, t) {

    var grille = t.exercices.map(function (y, k) {

      '<label class="rev-libelle" for="rev-saisie">Réponse</label>' +

        (EXEMPLES[x.type] ? ' placeholder="Exemple : ' + esc(EXEMPLES[x.type]) + '"' : '') + ' value="' + esc(e.saisie) + '"' + (resolu ? ' readonly' : '') + '>' +
        '<button class="bouton plein" type="button" data-action="verifier"' + (resolu ? ' disabled' : '') + '>Vérifier</button></div>' +
      (resolu ? '' : '<div class="rev-outils"><span class="rev-touches" role="group" aria-label="Aide à la saisie">' + (TOUCHES[x.type] || TOUCHES.egal).map(function (tc) {

    if (e.verdict) {

  function saisieRev(champSaisie) {

    } else if (action === 'suivant' || action === 'precedent' || action === 'aller') {

  /* ---------- Envoi de la progression au professeur ---------- */
  var envoiEtat = {};
  function isoAujourdhui() { var d = new Date(); return d.getFullYear() + '-' + deuxChiffres(d.getMonth() + 1) + '-' + deuxChiffres(d.getDate()); }
  function nomProf() { return D.reglages.professeur || 'mon professeur'; }
  function progressionClasse(c) {
    var r = { revisions: [], qcm: [], flashcards: [] };
    c.chapitres.forEach(function (ch) {
      var cle0 = c.dossier + '~' + ch.id;
      ch.revisions.forEach(function (t) {
        var cle = cle0 + '~' + idTheme(t), b = bilanRev(cle, t), m = memoRev(cle), ok = [], ko = [];
        t.exercices.forEach(function (x) { var st = m[idExo(x)]; if (st) (st.s === 'ok' ? ok : ko).push(idExo(x)); });
        r.revisions.push({ chapitre: ch.titre, titre: t.titre, total: t.exercices.length, reussis: b.ok, aRetravailler: b.ko, ok: ok, ko: ko });
      });
      ch.qcms.forEach(function (q, k) {
        var m = lire('qcm:' + cle0 + '~q' + k + '~' + hachage(q.titre));
        r.qcm.push({ chapitre: ch.titre, titre: q.titre, total: q.questions.length, meilleur: typeof m === 'number' ? m : null });
      });
      ch.paquets.forEach(function (p, k) {

        r.flashcards.push({ chapitre: ch.titre, titre: p.titre, total: p.cartes.length, sues: ids.length, ids: ids });
      });
    });
    return r;
  }
  // Identifiant de cet appareil, pour réunir les envois du téléphone et de l'ordinateur d'un même élève

    return id;
  }

  /* Code d'accès de l'élève : demandé à la première visite, puis mémorisé sur l'appareil */
  var ident = { ouvert: false, plusTard: false, statut: '', message: '', saisie: null };

  function carteIdent() {

      '<button class="bouton plein" type="button" data-action="ident-valider"' + (ident.statut === 'encours' ? ' disabled' : '') + '>Valider</button>' +

  function actionIdent(action) {

  function activite(p) {

  }
  function classeDeLEleve() {

  function ouvrirIdent() {
    ident = { ouvert: true, plusTard: false, statut: '', message: '', saisie: null };
    rendre(true);
    window.scrollTo(0, 0);
    var ch = document.getElementById('ident-code');
    if (ch) { ch.focus({ preventScroll: true }); try { ch.select(); } catch (err) {} }
  }
  function envoyer(bloc) {
    var dossier = bloc.getAttribute('data-envoi'), c = trouverClasse(dossier), code = codeEleve();
    if (!c) return;
    if (!code) { ouvrirIdent(); return; }
    delete envoiEtat._annonce;
    envoiEtat.courant = { statut: 'encours', message: 'Envoi en cours…' };
    rendre(true);
    var sienne = classeDeLEleve() || (c.type !== 'revisions' ? c : null);
    var donnees = { code: code, classe: sienne ? sienne.nom : (lire('eleve:classe') || ''), appareil: idAppareil(), envoye: new Date().toISOString(), progression: progressionEleve(c) };
    fetch(D.reglages.envoi, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(donnees) })
      .then(function (r) { return r.json(); })
      .then(function (rep) {
        if (rep && rep.erreur === 'code inconnu') {
          envoiEtat.courant = { statut: 'erreur', message: 'Le code ' + code + ' n’est pas reconnu. Le corriger avec « Changer », puis renvoyer.' };
          rendre(true); return;
        }
        if (!rep || !rep.ok) throw new Error((rep && rep.erreur) || 'refus');
        var jour = isoAujourdhui();
        ecrire('envoi:dernier', jour);
        envoiEtat.courant = { statut: 'ok', message: 'Progression envoyée à ' + nomProf() + ' le ' + dateLongue(jour) + '. Merci !' };
        rendre(true);
      })
      .catch(function () {
        envoiEtat.courant = { statut: 'erreur', message: 'L’envoi n’a pas abouti. Vérifier la connexion internet, puis réessayer.' };
        rendre(true);
      });
  }

  /* ---------- Impression ---------- */
  var zoneImpression = document.getElementById('impression');
  function imprimer(html) {
    zoneImpression.innerHTML = html;
    document.body.classList.add('imprime');
    var fin = function () { document.body.classList.remove('imprime'); zoneImpression.innerHTML = ''; window.removeEventListener('afterprint', fin); };
    window.addEventListener('afterprint', fin);
    setTimeout(function () { window.print(); }, 50);
  }
  function lieuDe(cle) {
    var parts = cle.split('~'), c = trouverClasse(parts[0]), ch = c && trouverChapitre(c, parts[1]);
    return c && ch ? c.nom + ' · ' + nomChapitre(ch) + ' · ' + ch.titre : '';
  }
  function imprimerPaquet(cle, p) {
    imprimer('<h1>' + esc(p.titre) + '</h1><div class="sous-titre">' + esc(lieuDe(cle)) + ' · ' + esc(D.reglages.matiere + ', ' + D.reglages.etablissement) + '</div>' +
      '<table><thead><tr><th></th><th>Question</th><th>Réponse</th></tr></thead><tbody>' +
      p.cartes.map(function (c, k) { return '<tr><td class="num">' + (k + 1) + '</td><td>' + formules(c.q) + '</td><td>' + formules(c.r) + '</td></tr>'; }).join('') +
      '</tbody></table>');
  }

  function trouverThemeParTitre(titre) {
    var n = norm(titre).replace(/^revision\s*-\s*/, '').trim();
    for (var i = 0; i < D.classes.length; i++) for (var j = 0; j < D.classes[i].chapitres.length; j++) {
      var ch = D.classes[i].chapitres[j];
      for (var k = 0; k < ch.revisions.length; k++) if (norm(ch.revisions[k].titre) === n) return { c: D.classes[i], ch: ch, t: ch.revisions[k] };
    }
    return null;
  }
  function blocPrerequis(ch) {
    if (!ch.prerequis || !ch.prerequis.length) return '';
    var liens = ch.prerequis.map(function (titre) {
      var r = trouverThemeParTitre(titre);
      if (!r) return '<span class="prereq absent">' + esc(titre) + ' · bientôt</span>';
      var cle = r.c.dossier + '~' + r.ch.id + '~' + idTheme(r.t), b = bilanRev(cle, r.t), n = r.t.exercices.length;
      var etat = b.ok >= 0.8 * n ? 'ok' : (b.ok + b.ko ? 'encours' : '');
      return '<a class="prereq" data-type="revision" href="#' + esc(cle) + '" data-vue="' + esc(cle) + '">' + esc(r.t.titre) +
        '<span class="prereq-score ' + etat + '">' + b.ok + '/' + n + '</span></a>';
    }).join('');
    return '<section class="carte prerequis" data-type="revision" aria-labelledby="titre-prereq">' +
      '<h2 id="titre-prereq">À maîtriser avant de commencer</h2>' +
      '<p>Ces notions servent tout au long du chapitre. S’entraîner dans les Révisions :</p>' +
      '<div class="prereq-liste">' + liens + '</div></section>';
  }

  function vueChapitre(c, ch) {
    var cle0 = c.dossier + '~' + ch.id;
    var t = filAriane([['Accueil', ''], [c.nom, c.dossier], [ch.titre]]) +
      '<span class="surtitre">' + esc(c.nom) + ' · ' + nomChapitre(ch) + '</span><h1>' + esc(ch.titre) + '</h1>';
    var html = blocPrerequis(ch);
    if (ch.essentiel.trim()) {
      html += '<section class="carte essentiel" aria-labelledby="titre-ess"><div class="essentiel-haut">' +
        '<h2 id="titre-ess"><svg aria-hidden="true"><use href="#i-cible"/></svg>L’essentiel du chapitre</h2>' +
        '<button class="bouton discret" type="button" id="imprimer-essentiel"><svg aria-hidden="true"><use href="#i-imprimer"/></svg>Imprimer</button></div>' +
        '<div class="prose">' + md(ch.essentiel) + '</div></section>';
    }
    var groupes = {};
    ch.documents.forEach(function (d) { (groupes[d.type] = groupes[d.type] || []).push(d); });
    html += '<div class="groupes">';
    ORDRE.forEach(function (t) {
      if (t === 'flashcards') {
        if (!ch.paquets.length) return;
        html += '<section class="groupe" data-type="flashcards"><h2 class="groupe-titre"><span class="pastille" aria-hidden="true"></span>Flashcards</h2>' +
          '<div class="docs larges">' + ch.paquets.map(function (p, k) { return cartePaquet(cle0 + '~f' + k + '~' + hachage(p.titre), p); }).join('') + '</div></section>';
        return;
      }
      if (t === 'revision') {
        if (!ch.revisions.length) return;
        html += '<section class="groupe" data-type="revision"><h2 class="groupe-titre"><span class="pastille" aria-hidden="true"></span>Révisions</h2>' +
          '<div class="themes">' + ch.revisions.map(function (th) { return carteTheme(c, ch, th); }).join('') + '</div></section>';
        return;
      }
      if (t === 'qcm') {
        if (!ch.qcms.length) return;
        html += '<section class="groupe" data-type="qcm"><h2 class="groupe-titre"><span class="pastille" aria-hidden="true"></span>QCM</h2>' +
          '<div class="docs larges">' + ch.qcms.map(function (q, k) { return carteQcm(cle0 + '~q' + k + '~' + hachage(q.titre), q); }).join('') + '</div></section>';
        return;
      }
      if (!groupes[t]) return;
      html += '<section class="groupe" data-type="' + t + '"><h2 class="groupe-titre"><span class="pastille" aria-hidden="true"></span>' + TYPES[t].label + '</h2>' +
        '<div class="docs">' + groupes[t].map(carteDoc).join('') + '</div></section>';
    });
    if (!ch.documents.length && !ch.paquets.length && !ch.qcms.length && !ch.revisions.length) html += '<p class="carte vide">Les documents de ce chapitre arrivent bientôt.</p>';
    return { tete: t, corps: html + '</div>' };
  }

  function vueMethodologie() {
    return {
      tete: filAriane([['Accueil', ''], ['Méthodologie']]) + '<span class="surtitre">Conseils</span><h1>Méthodologie</h1>',
      corps: '<article class="carte page-texte"><div class="prose">' + md(D.textes.methodologie) + '</div></article>'
    };
  }

  function vueRecherche(q) {
    var mots = norm(q).split(/\s+/).filter(Boolean);
    var res = [];
    function test(texte) { var n = norm(texte); return mots.every(function (m) { return n.indexOf(m) !== -1; }); }
    D.classes.forEach(function (c) {
      c.chapitres.forEach(function (ch) {
        var lieu = c.nom + ' · ' + ch.titre, cible = c.dossier + '~' + ch.id;
        if (test('chapitre ' + ch.titre + ' ' + c.nom + ' ' + ch.essentiel)) res.push({ type: 'chapitre', titre: ch.titre, lieu: c.nom + ' · ' + nomChapitre(ch), cible: cible });
        ch.documents.forEach(function (d) {
          if (d.disponible && test(TYPES[d.type].label + ' ' + d.titre + ' ' + lieu)) res.push({ type: d.type, titre: d.titre, lieu: lieu, cible: cible, lien: d.fichier });
        });
        ch.paquets.forEach(function (p) {
          if (test('flashcards ' + p.titre + ' ' + lieu + ' ' + p.cartes.map(function (k) { return k.q + ' ' + k.r; }).join(' '))) res.push({ type: 'flashcards', titre: p.titre, lieu: lieu, cible: cible });
        });
        ch.revisions.forEach(function (x) {
          if (test('revisions exercices ' + x.titre + ' ' + lieu)) res.push({ type: 'revision', titre: x.titre, lieu: lieu, cible: cible + '~' + idTheme(x) });
        });
        ch.qcms.forEach(function (x) {
          if (test('qcm quiz ' + x.titre + ' ' + lieu + ' ' + x.questions.map(function (k) { return k.q; }).join(' '))) res.push({ type: 'qcm', titre: x.titre, lieu: lieu, cible: cible });
        });
      });
    });
    if (D.textes.methodologie && test('methodologie methode conseils ' + D.textes.methodologie)) res.push({ type: 'methode', titre: 'Méthodologie', lieu: 'Conseils pour travailler', cible: 'methodologie' });
    function surligner(t) {
      var h = esc(t);
      mots.forEach(function (m) {
        var i = norm(t).indexOf(m);
        if (i !== -1 && m.length > 1) { var o = t.substr(i, m.length); h = h.replace(esc(o), '<mark>' + esc(o) + '</mark>'); }
      });
      return h;
    }
    var tt = '<span class="surtitre">Recherche</span><h1>« ' + esc(q) + ' »</h1>';
    var corps = '<h2 class="titre-section">Résultats <small>' + pluriel(res.length, 'résultat') + '</small></h2>';
    if (!res.length) corps += '<p class="carte vide">Rien trouvé. Essayez un autre mot, par exemple « fonction » ou « méthode ».</p>';
    else corps += '<div class="resultats">' + res.slice(0, 60).map(function (r) {
      var label = r.type === 'chapitre' ? 'Chapitre' : TYPES[r.type].court;
      return '<a class="carte resultat" ' + lienRessource(r) + '><span class="puce" data-type="' + r.type + '">' + label + '</span><span class="resultat-titre">' + surligner(r.titre) + '</span><span class="resultat-lieu">' + esc(r.lieu) + '</span></a>';
    }).join('') + '</div>';
    return { tete: tt, corps: corps };
  }

  /* ---------- Rendu ---------- */
  var derniere = '';
  function rendre(garderPosition) {
    if (!D) return;
    var q = champ.value.trim();
    var parts = vue.split('~');
    var c = trouverClasse(parts[0]);
    var ch = c && parts[1] ? trouverChapitre(c, parts[1]) : null;
    var th = ch && parts[2] ? trouverTheme(ch, parts[2]) : null;

    Array.prototype.forEach.call(document.querySelectorAll('#nav a'), function (a) {
      var v = a.getAttribute('data-vue');
      if ((c && v === c.dossier) || (!c && v === vue && v)) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });

    var titre = D.reglages.matiere, r;
    if (q.length >= 2) r = vueRecherche(q);
    else if (c && ch && th) { r = vueRevision(c, ch, th); titre = th.titre + ' · Révisions · ' + c.nom; }
    else if (c && ch) { r = vueChapitre(c, ch); titre = ch.titre + ' · ' + c.nom; }
    else if (c) { r = vueClasse(c); titre = c.nom + ' · ' + D.reglages.matiere; }
    else if (vue === 'methodologie' && D.textes.methodologie.trim()) { r = vueMethodologie(); titre = 'Méthodologie · ' + D.reglages.matiere; }
    else r = vueAccueil();

    var y = window.scrollY, actif = document.activeElement, curseur = null;
    var idActif = actif && (actif.id === 'rev-saisie' || actif.id === 'ident-code') ? actif.id : null;
    if (idActif) { try { curseur = actif.selectionStart; } catch (e) {} }
    tete.innerHTML = r.tete;
    tete.className = 'enveloppe tete' + (r.haute ? ' haute' : '');
    contenu.className = 'enveloppe' + (r.haute ? ' chevauche' : '');
    contenu.innerHTML = carteIdent() + r.corps;
    if (garderPosition === true) window.scrollTo(0, y);
    if (curseur != null) { var nv = document.getElementById(idActif); if (nv && !nv.readOnly) { nv.focus({ preventScroll: true }); try { nv.setSelectionRange(curseur, curseur); } catch (e) {} } }
    document.title = titre + ' · ' + D.reglages.etablissement;
  }

  contenu.addEventListener('click', function (e) {
    var copie = e.target.closest('#copier-mail');
    if (copie) {
      var adr = D.reglages.email;
      var ok = function () { copie.textContent = 'Adresse copiée'; setTimeout(function () { copie.textContent = 'Copier l’adresse'; }, 2000); };
      var repli = function () { var rg = document.createRange(); rg.selectNodeContents(document.getElementById('adresse-mail')); var s = getSelection(); s.removeAllRanges(); s.addRange(rg); copie.textContent = 'Adresse sélectionnée'; };
      try { navigator.clipboard.writeText(adr).then(ok, repli); } catch (err) { repli(); }
      return;
    }
    if (e.target.closest('#imprimer-essentiel')) {
      var parts = vue.split('~'), c = trouverClasse(parts[0]), ch = c && trouverChapitre(c, parts[1]);
      if (ch) imprimer('<h1>L’essentiel · ' + esc(ch.titre) + '</h1><div class="sous-titre">' + esc(c.nom + ' · ' + nomChapitre(ch) + ' · ' + D.reglages.matiere + ', ' + D.reglages.etablissement) + '</div><div class="prose">' + md(ch.essentiel) + '</div>');
      return;
    }
    var b = e.target.closest('[data-action]');
    if (!b) return;
    var act = b.getAttribute('data-action');
    if (act === 'ident-ouvrir') { ouvrirIdent(); return; }
    if (act === 'ident-valider' || act === 'ident-fermer') { actionIdent(act); return; }
    var bloc = b.closest('[data-envoi]');
    if (bloc) { envoyer(bloc); return; }
    bloc = b.closest('[data-paquet]');
    if (bloc) { actionPaquet(bloc, b.getAttribute('data-action')); return; }
    bloc = b.closest('[data-qcm]');
    if (bloc) { actionQcm(bloc, b.getAttribute('data-action'), b); return; }
    bloc = b.closest('[data-rev]');
    if (bloc) actionRev(bloc, b.getAttribute('data-action'), b);
  });
  contenu.addEventListener('input', function (e) {
    if (e.target.id === 'rev-saisie') saisieRev(e.target);
    if (e.target.id === 'ident-code') ident.saisie = e.target.value;
  });
  contenu.addEventListener('keydown', function (e) {
    if (e.target.id === 'ident-code' && e.key === 'Enter') { e.preventDefault(); actionIdent('ident-valider'); return; }
    if (e.target.id === 'rev-saisie' && e.key === 'Enter') { e.preventDefault(); var bloc = e.target.closest('[data-rev]'); if (bloc) actionRev(bloc, 'verifier'); }
  });

  function demarrer(donnees) {
    D = donnees;
    D.classes.forEach(function (c) { c.chapitres.forEach(function (ch) { ch.paquets = ch.paquets || []; ch.qcms = ch.qcms || []; ch.revisions = ch.revisions || []; ch.essentiel = ch.essentiel || ''; }); c.progression = c.progression || ''; });
    D.textes.methodologie = D.textes.methodologie || '';
    var r = D.reglages;
    document.getElementById('nom-site').textContent = r.matiere;
    document.getElementById('lieu-site').textContent = r.etablissement;
    document.getElementById('nav').innerHTML = D.classes.map(function (c) {
      return '<a href="#' + esc(c.dossier) + '" data-vue="' + esc(c.dossier) + '">' + esc(c.nom) + '</a>';
    }).join('') + (D.textes.methodologie.trim() ? '<a href="#methodologie" data-vue="methodologie">Méthodologie</a>' : '');
    document.getElementById('pied-gauche').textContent = r.matiere + ' · ' + r.etablissement;
    var g = new Date(D.genere);
    document.getElementById('pied-droite').textContent = 'Mis à jour le ' + g.getDate() + ' ' + MOIS[g.getMonth()] + ' ' + g.getFullYear();
    vue = lireAdresse();
    rendre();
    majBoutonEleve();
  }
  document.getElementById('bouton-eleve').addEventListener('click', function () { ouvrirIdent(); });

  fetch('donnees.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(demarrer)
    .catch(function () {
      tete.innerHTML = '<h1>Mathématiques</h1>';
      contenu.innerHTML = '<p class="carte vide">Le site n’a pas pu charger la liste des documents. Réessayez dans quelques instants.</p>';
    });
})();
</script>
</body>
</html>
